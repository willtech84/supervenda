<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Supervenda</title>
  <meta name="theme-color" content="#080f1e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:        #080f1e;
      --bg2:       #0d1729;
      --bg3:       #112040;
      --surface:   rgba(13,23,41,0.9);
      --border:    rgba(255,255,255,0.07);
      --border-hi: rgba(255,255,255,0.14);
      --text:      #e8eef8;
      --muted:     #6b82a8;
      --muted2:    #3a4f72;
      --green:     #00e676;
      --green-dim: #00b85a;
      --green-bg:  rgba(0,230,118,0.08);
      --red:       #ff5252;
      --red-bg:    rgba(255,82,82,0.08);
      --amber:     #ffb300;
      --blue:      #4488ff;
      --blue-bg:   rgba(68,136,255,0.08);
      --radius:    14px;
      --radius-sm: 9px;
      --nav-h:     64px;
      --sidebar-w: 240px;
      --font:      'DM Sans', sans-serif;
      --mono:      'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ============ HIDDEN ============ */
    .hidden { display: none !important; }

    /* ============ SCROLLBAR ============ */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted2); border-radius: 4px; }

    /* ============ LOGIN ============ */
    #login-section {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 20px;
      background:
        radial-gradient(ellipse 80% 60% at 10% 0%, rgba(0,230,118,0.07) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 100%, rgba(68,136,255,0.07) 0%, transparent 60%),
        var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 20px;
      padding: 32px 28px;
      backdrop-filter: blur(20px);
      animation: fadeUp .4s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .login-logo-icon {
      width: 40px; height: 40px;
      background: var(--green-bg);
      border: 1px solid rgba(0,230,118,0.25);
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    .login-logo-text {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .login-logo-text span { color: var(--green); }

    .login-card h2 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .login-card p {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
      letter-spacing: 0.3px;
    }

    .field input, .field select, .field textarea {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      transition: border-color .15s;
      -webkit-appearance: none;
    }

    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: var(--green-dim);
      box-shadow: 0 0 0 3px rgba(0,230,118,0.08);
    }

    .field textarea { resize: vertical; min-height: 80px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 18px;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all .15s;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-primary {
      background: var(--green-dim);
      border-color: var(--green-dim);
      color: #000;
      width: 100%;
    }
    .btn-primary:hover { background: var(--green); border-color: var(--green); }
    .btn-primary:active { transform: scale(.98); }

    .btn-secondary {
      background: var(--bg3);
      border-color: var(--border-hi);
      color: var(--text);
    }
    .btn-secondary:hover { border-color: rgba(255,255,255,0.22); }
    .btn-secondary:active { transform: scale(.98); }

    .btn-danger {
      background: var(--red-bg);
      border-color: var(--red);
      color: var(--red);
    }
    .btn-danger:hover { background: rgba(255,82,82,0.15); }
    .btn-danger:active { transform: scale(.98); }

    .btn-ghost {
      background: transparent;
      border-color: var(--border-hi);
      color: var(--muted);
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--border-hi); }

    .btn-icon {
      width: 36px; height: 36px;
      padding: 0;
      border-radius: var(--radius-sm);
      font-size: 16px;
    }

    .login-alt {
      margin-top: 18px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .link {
      color: var(--green);
      cursor: pointer;
      text-decoration: none;
      font-weight: 500;
    }
    .link:hover { text-decoration: underline; }

    /* ============ APP SHELL ============ */
    #workspace-section {
      display: flex;
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* ---- Sidebar (desktop) ---- */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 40;
      overflow-y: auto;
      transition: transform .25s cubic-bezier(.4,0,.2,1);
    }

    .sidebar-brand {
      padding: 20px 16px 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .sidebar-brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px; height: 34px;
      background: var(--green-bg);
      border: 1px solid rgba(0,230,118,0.2);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand-name span { color: var(--green); }

    .sidebar-user {
      margin-top: 8px;
      font-size: 12px;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar-nav {
      padding: 12px 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .nav-section-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted2);
      padding: 8px 8px 4px;
      margin-top: 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 400;
      color: var(--muted);
      border: 1px solid transparent;
      transition: all .12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .nav-item:hover { background: var(--bg3); color: var(--text); }

    .nav-item.active {
      background: var(--green-bg);
      border-color: rgba(0,230,118,0.15);
      color: var(--green);
      font-weight: 500;
    }

    .nav-item-icon {
      width: 22px;
      text-align: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 12px 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* ---- Main area ---- */
    .main {
      flex: 1;
      margin-left: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(8,15,30,0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .page-content {
      padding: 16px;
      flex: 1;
      max-width: 900px;
      width: 100%;
    }

    /* ---- Mobile bottom nav ---- */
    .bottom-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 40;
      background: rgba(8,15,30,0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .bottom-nav-items {
      display: flex;
      height: var(--nav-h);
    }

    .bottom-nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      font-size: 10px;
      font-weight: 500;
      color: var(--muted);
      transition: color .12s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      padding: 6px 2px;
    }

    .bottom-nav-item .icon {
      font-size: 20px;
      line-height: 1;
      transition: transform .12s;
    }

    .bottom-nav-item.active {
      color: var(--green);
    }

    .bottom-nav-item.active .icon {
      transform: scale(1.15);
    }

    /* More menu drawer */
    .more-drawer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 50;
    }

    .more-drawer.open { display: block; }

    .more-drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.5);
    }

    .more-drawer-panel {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border-hi);
      border-radius: 20px 20px 0 0;
      padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
      animation: slideUp .2s ease both;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .more-drawer-handle {
      width: 36px; height: 4px;
      background: var(--muted2);
      border-radius: 2px;
      margin: 0 auto 16px;
    }

    .more-drawer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .more-drawer-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 12px 6px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      background: var(--bg3);
      border: 1px solid var(--border);
      transition: all .12s;
      -webkit-tap-highlight-color: transparent;
      text-align: center;
      line-height: 1.3;
    }

    .more-drawer-item .icon { font-size: 22px; }

    .more-drawer-item.active {
      background: var(--green-bg);
      border-color: rgba(0,230,118,0.2);
      color: var(--green);
    }

    .more-drawer-item:active { transform: scale(.96); }

    /* ============ CARDS / PANELS ============ */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    /* ============ DASHBOARD STATS ============ */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      transition: border-color .15s;
    }

    .stat-card:hover { border-color: var(--border-hi); }

    .stat-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -1px;
      line-height: 1;
    }

    .stat-icon {
      font-size: 18px;
      margin-bottom: 8px;
    }

    /* ============ LIST ITEMS ============ */
    .list-item {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 8px;
      transition: border-color .12s;
    }

    .list-item:hover { border-color: var(--border-hi); }

    .list-item-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 8px;
    }

    .list-item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    .list-item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }

    .meta-item {
      font-size: 12px;
      color: var(--muted);
    }

    .meta-item strong {
      color: var(--text);
      font-weight: 500;
    }

    .list-item-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--mono);
    }

    .badge-green { background: var(--green-bg); color: var(--green); }
    .badge-red { background: var(--red-bg); color: var(--red); }
    .badge-blue { background: var(--blue-bg); color: var(--blue); }
    .badge-amber { background: rgba(255,179,0,0.1); color: var(--amber); }
    .badge-muted { background: var(--bg3); color: var(--muted); }

    /* ============ FORM ============ */
    .form-card {
      background: var(--surface);
      border: 1px solid rgba(0,230,118,0.12);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      animation: fadeUp .2s ease both;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }

    .form-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* ============ SEARCH BAR ============ */
    .search-wrap {
      position: relative;
      flex: 1;
    }

    .search-wrap input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      background: var(--bg);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
    }

    .search-wrap input:focus {
      outline: none;
      border-color: var(--green-dim);
    }

    .search-icon {
      position: absolute;
      left: 11px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }

    /* ============ USER MENU ============ */
    .user-menu-wrap { position: relative; }

    .user-dropdown {
      display: none;
      position: absolute;
      right: 0; top: calc(100% + 6px);
      min-width: 180px;
      background: var(--bg2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      z-index: 100;
      box-shadow: 0 12px 32px rgba(0,0,0,.4);
      overflow: hidden;
      animation: fadeDown .15s ease both;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user-dropdown.open { display: block; }

    .user-dropdown-header {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }

    .user-dropdown-name {
      font-size: 13px;
      font-weight: 600;
    }

    .user-dropdown-role {
      font-size: 11px;
      color: var(--muted);
      margin-top: 2px;
    }

    .user-dropdown button {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 10px 14px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--font);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      transition: all .1s;
    }

    .user-dropdown button:hover { background: var(--bg3); color: var(--text); }

    /* ============ EMPTY STATE ============ */
    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: .5;
    }

    .empty-text {
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* ============ TOAST ============ */
    #sv-toast-wrap {
      position: fixed;
      top: 16px; right: 16px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 320px;
      pointer-events: none;
    }

    /* ============ LOADING ============ */
    #sv-loading {
      position: fixed;
      inset: 0;
      z-index: 9998;
      background: rgba(0,0,0,.5);
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .loading-box {
      background: var(--bg2);
      border: 1px solid var(--border-hi);
      border-radius: var(--radius);
      padding: 20px 28px;
      text-align: center;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border-hi);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin .6s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.mobile-open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,.5); }

      .main { margin-left: 0; padding-bottom: var(--nav-h); }

      .bottom-nav { display: block; }

      .page-content { padding: 12px; }

      .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }

      .stat-value { font-size: 22px; }

      .form-grid { grid-template-columns: 1fr; }

      .topbar { padding: 0 12px; }

      #sv-toast-wrap { right: 12px; left: 12px; max-width: none; }
    }

    @media (min-width: 769px) {
      .mobile-only { display: none !important; }
      .stats-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 1024px) {
      .stats-grid { grid-template-columns: repeat(4, 1fr); }
      .page-content { padding: 20px; }
    }
  </style>
</head>
<body>

  <!-- ============ LOGIN ============ -->
  <div id="login-section">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">🚀</div>
        <div class="login-logo-text">Super<span>venda</span></div>
      </div>

      <!-- Login -->
      <div id="view-login">
        <h2>Bem-vindo de volta</h2>
        <p>Acesse sua conta para continuar</p>

        <form id="login-form">
          <div class="field">
            <label>E-mail</label>
            <input type="email" name="email" placeholder="seu@email.com" autocomplete="username" required />
          </div>
          <div class="field">
            <label>Senha</label>
            <input type="password" name="senha" placeholder="••••••••" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:4px">Entrar</button>
        </form>

        <div class="login-alt">
          Primeiro acesso? <a class="link" id="goto-register">Criar conta admin</a>
        </div>
      </div>

      <!-- Cadastro -->
      <div id="view-register" class="hidden">
        <h2>Criar conta</h2>
        <p>Conta de administrador do sistema</p>

        <form id="register-form">
          <div class="field">
            <label>Nome completo</label>
            <input type="text" name="name" placeholder="Seu nome" required />
          </div>
          <div class="field">
            <label>E-mail</label>
            <input type="email" name="email" placeholder="seu@email.com" required />
          </div>
          <div class="field">
            <label>Senha</label>
            <input type="password" name="senha" placeholder="Mínimo 6 caracteres" required />
          </div>
          <button type="submit" class="btn btn-primary" style="margin-top:4px">Criar conta</button>
        </form>

        <div class="login-alt">
          Já tem conta? <a class="link" id="goto-login">Entrar</a>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="workspace-section" class="hidden">

    <!-- Sidebar (desktop + mobile overlay) -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-row">
          <div class="brand-icon">🚀</div>
          <div>
            <div class="brand-name">Super<span>venda</span></div>
          </div>
        </div>
        <div class="sidebar-user" id="sidebar-user-name">Carregando...</div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav"><!-- gerado por JS --></nav>

      <div class="sidebar-footer">
        <div class="nav-item" id="sidebar-backup-btn">
          <span class="nav-item-icon">💾</span> Backup
        </div>
        <div class="nav-item" id="sidebar-logout-btn" style="color: var(--red);">
          <span class="nav-item-icon">↩</span> Sair
        </div>
      </div>
    </aside>

    <!-- Sidebar backdrop (mobile) -->
    <div id="sidebar-backdrop" style="display:none;position:fixed;inset:0;z-index:39;background:rgba(0,0,0,.5);" onclick="closeSidebar()"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-ghost btn-icon mobile-only" id="menu-toggle" aria-label="Menu">☰</button>
          <h1 class="topbar-title" id="topbar-title">Dashboard</h1>
        </div>
        <div class="topbar-right">
          <button class="btn btn-ghost btn-icon" id="btn-backup" title="Backup" style="display:none" class="desktop-only">💾</button>
          <div class="user-menu-wrap">
            <button class="btn btn-secondary" id="btn-user" style="font-size:13px;padding:8px 12px;">
              <span>👤</span> <span id="btn-user-name">Usuário</span> <span style="color:var(--muted);font-size:11px;">▾</span>
            </button>
            <div class="user-dropdown" id="user-dropdown">
              <div class="user-dropdown-header">
                <div class="user-dropdown-name" id="dropdown-user-name">—</div>
                <div class="user-dropdown-role" id="dropdown-user-role">—</div>
              </div>
              <button data-action="trocar">🔄 Trocar usuário</button>
              <button data-action="sair" style="color:var(--red)">↩ Sair</button>
            </div>
          </div>
        </div>
      </header>

      <div class="page-content">
        <div id="sv-screen-root"></div>
      </div>
    </div>

    <!-- Bottom Nav (mobile) -->
    <nav class="bottom-nav" id="bottom-nav">
      <div class="bottom-nav-items" id="bottom-nav-items">
        <!-- gerado por JS -->
      </div>
    </nav>

    <!-- More drawer (mobile) -->
    <div class="more-drawer" id="more-drawer">
      <div class="more-drawer-backdrop" onclick="closeMoreDrawer()"></div>
      <div class="more-drawer-panel">
        <div class="more-drawer-handle"></div>
        <div class="more-drawer-grid" id="more-drawer-grid"><!-- gerado por JS --></div>
      </div>
    </div>

  </div>

  <!-- Loading -->
  <div id="sv-loading">
    <div class="loading-box">
      <div class="spinner"></div>
      <span id="sv-loading-text" style="font-size:14px;color:var(--text);">Carregando...</span>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
