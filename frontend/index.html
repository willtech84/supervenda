<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supervenda - Vendas Externas</title>
  <meta name="theme-color" content="#0b1220" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1220;
      color: #fff;
      min-height: 100vh;
    }

    .hidden { display: none !important; }

    .app-shell {
      display: grid;
      grid-template-columns: 270px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      border-right: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, #0d1528 0%, #0a1220 100%);
      padding: 14px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
      padding: 12px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      background: rgba(255,255,255,.02);
    }
    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
    }
    .brand p {
      margin: 0;
      color: #b7c7e7;
      font-size: 12px;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      border: 1px solid rgba(255,255,255,.08);
      background: #0d1930;
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      transition: .15s ease;
    }
    .nav-btn:hover {
      border-color: rgba(255,255,255,.18);
      transform: translateY(-1px);
    }
    .nav-btn.active {
      border-color: #1dd17b;
      background: #11261b;
    }
    .nav-btn .hint {
      color: #9cb2d8;
      font-size: 11px;
      white-space: nowrap;
    }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      border-bottom: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.02);
      backdrop-filter: blur(6px);
      padding: 12px 16px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .topbar-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .topbar-subtitle {
      margin-top: 4px;
      color: #b7c7e7;
      font-size: 12px;
    }

    .content {
      padding: 14px;
      width: 100%;
      max-width: 1200px;
    }

    .panel {
      background: rgba(10,20,40,.7);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      padding: 14px;
    }

    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(circle at 10% 10%, rgba(29,209,123,.12), transparent 40%),
        radial-gradient(circle at 80% 20%, rgba(77,127,255,.10), transparent 45%),
        #0b1220;
    }

      width: 100%;
      max-width: 420px;

      border: 1px solid rgba(255,255,
