<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Vendas Externas Pro (Cloud)</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#111827"/>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="brand">Vendas <span>Externas Pro</span></div>
      <div class="small">Cloudflare (Login por vendedor)</div>
      <div class="nav"></div>
      <div class="small" style="margin-top:14px; line-height:1.4">
        Dados salvos na nuvem (D1) + backup no R2.
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <div class="small">Você está em:</div>
          <div style="font-size:20px; font-weight:900" id="pageTitle">Dashboard</div>
        </div>
        <div class="search">
          <input id="q" placeholder="Buscar (cliente, produto...)">
        </div>
        <div class="actions">
          <button class="btn" onclick="window.print()">Imprimir</button>
        </div>
      </div>
      <div id="view"></div>
    </main>
  </div>

  <div id="toast" style="position:fixed; right:14px; bottom:14px; background:#0b1325; border:1px solid var(--border); padding:10px 12px; border-radius:12px; opacity:0; transition:opacity .2s; z-index:99999"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
