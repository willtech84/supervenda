# wrangler.toml — Supervenda Worker
name = "vendas-externas-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# ── Observabilidade (logs em tempo real) ──────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

# ── D1 Database ──────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "vendas_pro"
database_id = "102413e6-5a14-4668-97e9-4a66ad5e58ea"

# ── R2 Bucket para backups ───────────────────────────────────────
# Crie o bucket no Cloudflare > R2 com o nome "supervenda-backups"
# depois atualize o nome abaixo se usar outro nome
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "supervenda-backups"

# ── Cron: backup automático todo dia às 03:00 UTC ────────────────
[triggers]
crons = ["0 3 * * *"]

# ── Variáveis de ambiente ────────────────────────────────────────
# JWT_SECRET deve ser definido como Secret no dashboard:
# Workers > seu worker > Settings > Variables > Add secret
# NÃO coloque o valor aqui em texto plano!
